<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yaansyaans •ᴗ•</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .card {
            position: relative;
            z-index: 2;
            background: #000;
            border: 2px solid #fff;
            padding: 2.5rem 2rem;
            width: 90%;
            max-width: 440px;
            text-align: center;
            box-shadow: 6px 6px 0px #fff;
        }

        .profile-icon {
            width: 88px;
            height: 88px;
            border-radius: 0;
            border: 2px solid #fff;
            margin-bottom: 1rem;
            object-fit: cover;
        }

        .header-group {
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 1px;
            display: inline-block;
        }

        .pronouns {
            display: inline-block;
            font-size: 0.8rem;
            color: #888;
            border: 1px solid #888;
            padding: 2px 6px;
            margin-left: 6px;
            vertical-align: middle;
        }

        p.bio {
            color: #ddd;
            font-size: 0.88rem;
            line-height: 1.5;
            margin-bottom: 1.8rem;
            text-align: left;
            border-left: 2px solid #fff;
            padding-left: 10px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        .link-btn {
            color: #fff;
            text-decoration: none;
            padding: 0.75rem 1rem;
            border: 2px solid #fff;
            background: #000;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 4px 4px 0px #fff;
            transition: all 0.1s ease;
        }

        .link-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 2px 2px 0px #fff;
            transform: translate(2px, 2px);
        }

        .link-btn:hover svg {
            fill: #000;
        }

        .link-btn svg {
            fill: #fff;
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="card">
        <img src="icon.png" alt="Profile Icon" class="profile-icon">
        <div class="header-group">
            <h1>yaans</h1>
            <span class="pronouns">he/him</span>
        </div>
        
        <p class="bio">hiya! i'm yaans, i like tinkering with Linux and some random machines. I also like playing around with AI tools and other things •ᴗ•.</p>
